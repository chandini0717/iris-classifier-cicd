<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Iris Flower Classifier</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f7f9;
            margin: 0;
            padding: 0;
        }

        .container {
            width: 500px;
            max-width: 90%;
            margin: 60px auto;
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.15);
        }

        h1 {
            text-align: center;
            color: #333;
            margin-bottom: 30px;
        }

        label {
            display: block;
            margin-top: 15px;
            margin-bottom: 6px;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 12px;
            box-sizing: border-box;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 16px;
        }

        button {
            width: 100%;
            margin-top: 25px;
            padding: 13px;
            background: #28a745;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 18px;
            cursor: pointer;
        }

        button:hover {
            background: #218838;
        }

        #result {
            margin-top: 25px;
            text-align: center;
            font-size: 20px;
            font-weight: bold;
        }
    </style>
</head>

<body>

<div class="container">

    <h1>Iris Flower Classifier</h1>

    <label>Sepal Length</label>
    <input type="number" id="sepal_length" step="any">

    <label>Sepal Width</label>
    <input type="number" id="sepal_width" step="any">

    <label>Petal Length</label>
    <input type="number" id="petal_length" step="any">

    <label>Petal Width</label>
    <input type="number" id="petal_width" step="any">

    <button onclick="predict()">Predict</button>

    <div id="result"></div>

</div>

<script>
async function predict() {

    const sepalLength =
        parseFloat(document.getElementById("sepal_length").value);

    const sepalWidth =
        parseFloat(document.getElementById("sepal_width").value);

    const petalLength =
        parseFloat(document.getElementById("petal_length").value);

    const petalWidth =
        parseFloat(document.getElementById("petal_width").value);

    if (
        isNaN(sepalLength) ||
        isNaN(sepalWidth) ||
        isNaN(petalLength) ||
        isNaN(petalWidth)
    ) {
        document.getElementById("result").innerText =
            "Please enter all four values.";
        return;
    }

    try {

        const response = await fetch("/predict", {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify({
                features: [
                    sepalLength,
                    sepalWidth,
                    petalLength,
                    petalWidth
                ]
            })
        });

        const data = await response.json();

        if (response.ok) {
            document.getElementById("result").innerText =
                "Prediction: " + data.prediction;
        } else {
            document.getElementById("result").innerText =
                "Error: " + (data.error || "Prediction failed");
        }

    } catch (error) {

        document.getElementById("result").innerText =
            "Error connecting to server.";
    }
}
</script>

</body>
</html>
